name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  COREPACK_DEFAULT_TO_LATEST: '0'

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - name: Show tool versions
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test (native watchers required)
        env:
          CRR_REQUIRE_NATIVE_WATCH: '1'
        run: pnpm run test
      - name: Build distribution
        run: pnpm run build:dist
      - name: Verify no polling
        run: pnpm run verify:no-polling
      - name: Verify no secrets
        run: pnpm run verify:no-secrets
      - name: Verify attribution
        run: pnpm run verify:attribution
